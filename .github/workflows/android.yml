name: Build Akshara APK

# Builds an installable Android APK in the cloud — no Android tools needed
# on your machine. Runs on every push, and can be started by hand from the
# Actions tab (Run workflow). Download the finished APK from the run's
# "Artifacts" section.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java (needed by the Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: akshara-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
